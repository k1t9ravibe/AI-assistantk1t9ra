<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — Ассистент закупщика</title>
  <link rel="icon" href="/icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <form id="loginForm" class="login-box">
    <h1>Ассистент закупщика</h1>
    <label>Пароль
      <input type="password" id="password" autocomplete="current-password" autofocus required />
    </label>
    <p id="loginError" class="error"></p>
    <button class="primary" type="submit">Войти</button>
  </form>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("loginError");
      err.textContent = "";
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("password").value }),
      });
      if (res.ok) location.href = "/";
      else err.textContent = (await res.json().catch(() => null))?.error || "Не удалось войти";
    });
  </script>
</body>
</html>
